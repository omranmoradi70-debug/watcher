name: watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = گزارش کامل همین الان | daily = تحلیل روزانه | weekly = تحلیل هفتگی و آمار | monthly = تحلیل ماهانه | scan = اسکنر | stats = آمار نتیجه‌ها | replay = بازپخش تاریخی و الگوها | traders = ردیابی تریدرها | test = پیام آزمایشی | setup = پیدا کردن شناسه چت'
        default: 'run'
        type: choice
        options:
          - run
          - daily
          - weekly
          - monthly
          - scan
          - stats
          - replay
          - traders
          - test
          - setup

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: run
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          EVENT: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node notifier.js "$MODE"
      - name: save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "watcher"
            git config user.email "watcher@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            for i in 1 2 3; do
              git pull --rebase --autostash || true
              if git push; then ok=1; break; fi
              sleep $((i * 5))
            done
            if [ -z "$ok" ]; then echo "::warning::ذخیره‌ی state.json ناموفق بود (push)"; exit 1; fi
          fi
