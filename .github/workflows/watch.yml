name: watch

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup = پیدا کردن شناسه چت | test = پیام آزمایشی | run = اجرای عادی'
        default: 'run'
        type: choice
        options:
          - run
          - test
          - setup

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node notifier.js "$MODE"
      - name: save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "watcher"
            git config user.email "watcher@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
          
